<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon compte · Décrypte ton fonds</title>
  <meta name="description" content="Ton compte Décrypte ton fonds : simulations enregistrées, abonnement, données personnelles.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">Décrypte ton fonds</a>
    <nav class="onglets" aria-label="Pages du site">
      <a href="index.html" data-page="index.html">Accueil</a>
      <a href="decrypte.html" data-page="decrypte.html" data-fonds>Décrypte<span class="texte-long"> ton fonds</span></a>
      <a href="performances.html" data-page="performances.html" data-fonds>Performances</a>
      <a href="simulateur.html" data-page="simulateur.html" data-fonds>Simulateur</a>
    </nav>
    <div class="entete-actions">
      <a class="btn-compte" id="lien-compte" href="compte.html" aria-current="page">Mon compte</a>
      <button type="button" class="btn-createur" id="btn-createur" aria-label="Créateurs du site (ouvre leurs profils LinkedIn)">Créateurs</button>
    </div>
  </header>

  <main class="page-compte">
    <h1>Mon compte</h1>
    <p id="message-compte" class="note" role="status" aria-live="polite" hidden></p>
    <section class="carte" id="bloc-acces"><p class="chargement">Chargement…</p></section>
    <section class="carte" id="simulations">
      <h2>Mes simulations</h2>
      <ul class="liste-simulations" id="liste-simulations"><li class="chargement">Chargement…</li></ul>
    </section>
    <section class="carte">
      <h2>Mes informations</h2>
      <form id="form-email" class="formulaire-compte formulaire-ligne">
        <label>Adresse e-mail <input type="email" name="email" autocomplete="email" required></label>
        <button type="submit" class="btn-secondaire">Changer d'adresse</button>
      </form>
      <form id="form-mdp" class="formulaire-compte formulaire-ligne">
        <label>Nouveau mot de passe <input type="password" name="mdp" autocomplete="new-password" minlength="10" required></label>
        <button type="submit" class="btn-secondaire">Changer le mot de passe</button>
      </form>
      <p class="actions-compte">
        <button type="button" class="btn-secondaire" id="exporter">Télécharger mes données</button>
        <button type="button" class="btn-secondaire" id="deconnecter">Me déconnecter</button>
        <button type="button" class="btn-danger" id="supprimer">Supprimer mon compte</button>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p class="liens-pied"><a href="mentions-legales.html">Mentions légales</a> · <a href="cgv.html">CGV</a> · <a href="confidentialite.html">Confidentialité</a></p>
  </footer>

  <script src="js/outils.js"></script>
  <script src="js/affichage.js"></script>
  <script src="js/config-compte.js"></script>
  <script src="js/compte.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/createur.js"></script>
  <script src="js/espace-compte.js"></script>
</body>
</html>
