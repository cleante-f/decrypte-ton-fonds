# Déploie la base (supabase/migrations) et les fonctions serveur (supabase/functions) sur le projet Supabase.
# Secrets : SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF (Settings → Secrets and variables → Actions).
name: Supabase (base et fonctions)

on:
  push:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJET: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Relier le projet
        run: supabase link --project-ref "$PROJET"
      - name: Appliquer les migrations de la base
        run: supabase db push
      - name: Adresses autorisées à appeler les fonctions (valeur publique, pas un secret)
        env:
          ORIGINES: "http://localhost:8770"   # la tâche 11 ajoute en tête l'adresse Cloudflare du site
        run: supabase secrets set ORIGINES="$ORIGINES" --project-ref "$PROJET"
      - name: Déployer les fonctions serveur
        run: if [ -d supabase/functions ] && ls supabase/functions/*/index.ts >/dev/null 2>&1; then supabase functions deploy --project-ref "$PROJET"; fi
