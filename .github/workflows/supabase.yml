# Déploie la base (supabase/migrations) et les fonctions serveur (supabase/functions) sur le projet Supabase.
# Secrets : SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF, ALERTES_SECRET (Settings → Secrets and variables → Actions).
name: Supabase (base et fonctions)

on:
  push:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJET: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Relier le projet
        run: supabase link --project-ref "$PROJET"
      - name: Appliquer les migrations de la base
        run: supabase db push
      - name: Adresses autorisées à appeler les fonctions (valeur publique, pas un secret)
        env:
          # La première adresse sert aussi de lien vers le site dans les e-mails (avertissement d'inactivité) : elle doit être
          # en mode comptes (HOTES_COMPTES de js/mode-site.js), d'où l'aperçu « comptes » de Cloudflare Pages ; l'adresse principale
          # decrypte-ton-fonds.pages.dev est en mode gratuit. Au lancement payant, mettre le domaine EN PREMIÈRE position.
          # Ensuite : l'adresse principale, l'adresse de test de la branche « refonte » (Cloudflare Pages) et le serveur local.
          ORIGINES: "https://comptes.decrypte-ton-fonds.pages.dev,https://decrypte-ton-fonds.pages.dev,https://refonte.decrypte-ton-fonds.pages.dev,http://localhost:8770"
        run: supabase secrets set ORIGINES="$ORIGINES" --project-ref "$PROJET"
      - name: Secret des liens de désinscription des alertes (le même que celui de la tâche alertes.yml)
        env:
          ALERTES_SECRET: ${{ secrets.ALERTES_SECRET }}
        # Secret absent : on ne remplace pas une valeur déjà en place par une valeur vide.
        run: |
          if [ -n "$ALERTES_SECRET" ]; then supabase secrets set ALERTES_SECRET="$ALERTES_SECRET" --project-ref "$PROJET"
          else echo "::warning::secret ALERTES_SECRET absent : la désinscription en un clic refusera les liens"; fi
      - name: Déployer les fonctions serveur
        run: if [ -d supabase/functions ] && ls supabase/functions/*/index.ts >/dev/null 2>&1; then supabase functions deploy --project-ref "$PROJET"; fi
