# Mise à jour quotidienne des données du simulateur :
# contexte économique (BCE, FMI, États-Unis), actualités par thème et séries de référence (AMF),
# puis taux de change et marchés du jour avec leurs sources de secours (scripts/actualiser_marches.py).
# Le résultat (data/contexte.js, data/references.js, data/marches.js) est enregistré dans le dépôt, ce qui republie le site.
# Clés d'API : Settings → Secrets and variables → Actions (voir .env.example). Sans clé, la source est sautée.
name: Mise à jour des données du simulateur

on:
  schedule:
    - cron: "23 5 * * *"   # chaque jour vers 7 h 23, heure de Paris (5 h 23 UTC)
  workflow_dispatch:         # bouton « Run workflow » pour lancer une mise à jour à la main
    inputs:
      forcer:
        description: "Rappeler toutes les API (marchés, change, actualités) malgré le cache de 6 h"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: donnees-simulateur
  cancel-in-progress: false

jobs:
  actualiser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les nouvelles données
        run: python3 scripts/actualiser_contexte.py
      - name: Taux de change et marchés du jour
        continue-on-error: true   # une panne ici ne doit pas empêcher d'enregistrer les autres données
        env:
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          MARKETAUX_KEY: ${{ secrets.MARKETAUX_KEY }}
        run: python3 scripts/actualiser_marches.py ${{ inputs.forcer && '--forcer' || '' }}
      - name: Enregistrer les fichiers modifiés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contexte.js data/references.js data/marches.js
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -m "Données économiques et séries de référence du $(date -u +%Y-%m-%d)"
            # le dépôt a pu changer pendant la mise à jour : on se remet à jour avant d'envoyer
            git pull --rebase origin main
            git push
          fi
